<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undertale</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    #overlay.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #status {
      font-size: 18px;
    }

    #sub-status {
      font-size: 13px;
      color: #aaa;
    }

    #bar {
      width: 300px;
      max-width: 90vw;
      height: 18px;
      border: 2px solid #fff;
      background: #000;
    }

    #fill {
      width: 0%;
      height: 100%;
      background: #fff;
    }

    #pct {
      font-size: 14px;
    }

    canvas#canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      outline: none;
    }
  </style>

  <!-- Track AudioContext instances, gate game loop until unlocked by click, and run at uncapped max FPS -->
  <script>
    (function setupAudioAndMaxFpsGate() {
      const trackedContexts = new Set();
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;

      window.__audioUnlocked = false;
      window.__waitingForClickStart = false;
      window.__onClickToStart = null;

      function isContextReady(ctx) {
        return ctx && ctx.state === 'running';
      }

      function anyContextReady() {
        if (trackedContexts.size === 0) return false;
        for (const ctx of trackedContexts) {
          if (isContextReady(ctx)) return true;
        }
        return false;
      }

      function tryResumeContext(ctx) {
        if (!ctx || typeof ctx.resume !== 'function') return Promise.resolve();
        if (ctx.state === 'suspended') {
          return ctx.resume().catch(() => {});
        }
        return Promise.resolve();
      }

      if (NativeAudioContext) {
        const WrappedAudioContext = function (...args) {
          const ctx = new NativeAudioContext(...args);
          trackedContexts.add(ctx);

          if (typeof ctx.addEventListener === 'function') {
            ctx.addEventListener('statechange', () => {
              if (ctx.state === 'running') {
                window.__audioUnlocked = true;
              }
            });
          }

          return ctx;
        };

        WrappedAudioContext.prototype = NativeAudioContext.prototype;
        Object.setPrototypeOf(WrappedAudioContext, NativeAudioContext);
        window.AudioContext = WrappedAudioContext;
        if (window.webkitAudioContext) {
          window.webkitAudioContext = WrappedAudioContext;
        }
      }

      async function resumeAllAudio() {
        const promises = [];
        trackedContexts.forEach((ctx) => promises.push(tryResumeContext(ctx)));

        if (window.SDL2 && window.SDL2.audioContext) {
          promises.push(tryResumeContext(window.SDL2.audioContext));
        }
        if (window.AL && window.AL.contexts) {
          Object.values(window.AL.contexts).forEach((alCtx) => {
            if (alCtx && alCtx.audioCtx) {
              promises.push(tryResumeContext(alCtx.audioCtx));
            }
          });
        }

        await Promise.all(promises);
        if (anyContextReady()) {
          window.__audioUnlocked = true;
        }
      }

      window.__resumeGameAudio = resumeAllAudio;

      // Uncapped native display refresh rate in foreground + zero-delay MessageChannel pump in background
      const origRequestAnimationFrame = window.requestAnimationFrame.bind(window);
      const channel = new MessageChannel();
      const bgCallbacks = new Map();
      let nextBgId = 1;

      channel.port1.onmessage = () => {
        if (bgCallbacks.size === 0) return;
        const batch = Array.from(bgCallbacks.entries());
        bgCallbacks.clear();
        const now = performance.now();
        for (const [, cb] of batch) {
          try {
            cb(now);
          } catch (e) {
            console.error(e);
          }
        }
      };

      window.requestAnimationFrame = function (cb) {
        if (document.hidden) {
          const id = nextBgId++;
          bgCallbacks.set(id, cb);
          if (bgCallbacks.size === 1) {
            channel.port2.postMessage(null);
          }
          return id;
        }
        return origRequestAnimationFrame(cb);
      };

      const origCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
      window.cancelAnimationFrame = function (id) {
        bgCallbacks.delete(id);
        return origCancelAnimationFrame(id);
      };

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && bgCallbacks.size > 0) {
          const batch = Array.from(bgCallbacks.values());
          bgCallbacks.clear();
          batch.forEach((cb) => origRequestAnimationFrame(cb));
        }

        if (window.__audioUnlocked) {
          resumeAllAudio();
        }
      });

      // Pause/gate game start until user clicks
      window.addEventListener('pointerdown', async () => {
        await resumeAllAudio();
        if (window.__waitingForClickStart && typeof window.__onClickToStart === 'function') {
          const cb = window.__onClickToStart;
          window.__waitingForClickStart = false;
          window.__onClickToStart = null;
          cb();
        }
      }, { capture: true, passive: true });
    })();
  </script>
</head>
<body>

    <div id="status">Loading...</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div id="sub-status">Checking files...</div>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

      "mus_undynetheme.ogg", "mus_undynetruetheme.ogg", "mus_vsasgore.ogg", "mus_waterfall.ogg",
      "mus_waterquiet.ogg", "mus_wawa.ogg", "mus_whoopee.ogg", "mus_wind.ogg", "mus_woofenstein.ogg",
      "mus_woofenstein_loop.ogg", "mus_wrongnumbersong.ogg", "mus_wrongworld.ogg", "mus_xpart.ogg",
      "mus_xpart_2.ogg", "mus_xpart_a.ogg", "mus_xpart_b.ogg", "mus_xpart_back.ogg",
      "mus_x_undyne.ogg", "mus_x_undyne_pre.ogg", "mus_yourbestfriend_3.ogg", "mus_zz_megalovania.ogg",
      "mus_zzz_c.ogg", "mus_zzz_c2.ogg", "mus_z_ending.ogg", "snd_ballchime.ogg", "snd_curtains.ogg",
      "snd_fall2.ogg", "snd_flameloop.ogg", "snd_f_destroyed.ogg", "snd_heavydamage.ogg",
      "snd_jingle.ogg", "snd_mushroomdance.ogg", "snd_save.ogg", "snd_sonar.ogg"
    ];

    // Save files in OPFS that should be preserved across game file updates
    const SAVE_FILE_PATTERNS = [
      /^file0$/i,
      /^file8$/i,
      /^file9$/i,
      /^undertale\.ini$/i,
      /^config\.ini$/i,
      /\.sav$/i,
      /\.save$/i,
      /\.ini$/i
    ];

    function isSaveFile(name) {
      return SAVE_FILE_PATTERNS.some((rx) => rx.test(name));
    }

    function setProgress(pct, msg, subMsg) {
      const clamped = Math.min(100, Math.max(0, pct));
      fillEl.style.width = `${clamped}%`;
      pctEl.textContent = `${Math.round(clamped)}%`;
      if (msg) statusEl.textContent = msg;
      if (subMsg !== undefined) subStatusEl.textContent = subMsg;
    }

    function showError(err) {
      console.error(err);
      overlayEl.classList.remove('fade-out');
      overlayEl.style.display = 'flex';
      statusEl.textContent = `Error: ${err.message}`;
      subStatusEl.textContent = 'Refresh to try again.';
    }

    async function writeToOpfs(dirHandle, fileName, bytes) {
      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }

    // Clear stale game assets in OPFS while keeping player save files intact
    async function clearStaleGameFiles(gameDir) {
      if (typeof gameDir.entries !== 'function') return;
      const removals = [];
      for await (const [entryName, handle] of gameDir.entries()) {
        if (handle.kind === 'file' && !isSaveFile(entryName)) {
          removals.push(gameDir.removeEntry(entryName).catch(() => {}));
        }
      }
      await Promise.all(removals);
    }

    // Fetch fresh asset bypassing HTTP/browser cache so updated files on disk are always used
    async function fetchFreshBytes(url) {
      const sep = url.includes('?') ? '&' : '?';
      const bustUrl = `${url}${sep}_t=${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const res = await fetch(bustUrl, { cache: 'no-store' });
      if (!res.ok) {
        return { ok: false, status: res.status, bytes: null };
      }
      const bytes = new Uint8Array(await res.arrayBuffer());
      return { ok: true, status: res.status, bytes };
    }

    function callStartRunnerWithArgs(instance, args) {
      const argvPtrs = args.map((str) => instance.stringToNewUTF8(str));
      const argvTable = new Uint32Array(argvPtrs.length + 1);
      argvPtrs.forEach((ptr, idx) => { argvTable[idx] = ptr; });
      argvTable[argvPtrs.length] = 0;

      return instance.ccall(
        'startRunner',
        'number',
        ['number', 'array'],
        [args.length, new Uint8Array(argvTable.buffer)],
        { async: true }
      );
    }

    function bindButterscotchInputs(instance) {
      window.addEventListener('keydown', (e) => {
        if (window.__resumeGameAudio) window.__resumeGameAudio();

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key)) {
          e.preventDefault();
        }
        if (typeof instance._onKeyDown === 'function') {
          instance._onKeyDown(e.keyCode || e.which);
        }
      }, { capture: true });

      window.addEventListener('keyup', (e) => {
        if (typeof instance._onKeyUp === 'function') {
          instance._onKeyUp(e.keyCode || e.which);
        }
      }, { capture: true });

      canvas.addEventListener('mousemove', (e) => {
        if (typeof instance._onMouseMove === 'function') {
          const rect = canvas.getBoundingClientRect();
          const x = Math.round(((e.clientX - rect.left) / rect.width) * canvas.width);
          const y = Math.round(((e.clientY - rect.top) / rect.height) * canvas.height);
          instance._onMouseMove(x, y);
        }
      }, { passive: true });

      canvas.addEventListener('mousedown', (e) => {
        if (window.__resumeGameAudio) window.__resumeGameAudio();
        window.focus();
        canvas.focus();
        if (typeof instance._onMouseDown === 'function') {
          instance._onMouseDown(e.button);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (typeof instance._onMouseUp === 'function') {
          instance._onMouseUp(e.button);
        }
      });
    }

    async function prepareFiles() {
      const opfsRoot = await navigator.storage.getDirectory();
      const gameDir = await opfsRoot.getDirectoryHandle('game', { create: true });

      setProgress(1, 'Updating game files...', 'Clearing old game cache (keeping saves)');
      await clearStaleGameFiles(gameDir);

      const total = 1 + OGG_FILES.length;
      let done = 0;

      setProgress(2, 'Loading...', 'data.win');
      const dataWinResult = await fetchFreshBytes('./game/data.win');
      if (!dataWinResult.ok || !dataWinResult.bytes || dataWinResult.bytes.length === 0) {
        throw new Error(`Missing or empty ./game/data.win (${dataWinResult.status})`);
      }
      await writeToOpfs(gameDir, 'data.win', dataWinResult.bytes);

      done++;
      setProgress((done / total) * 100, 'Loading...', `${done} / ${total}`);

      const BATCH_SIZE = 64;
      for (let i = 0; i < OGG_FILES.length; i += BATCH_SIZE) {
        const batch = OGG_FILES.slice(i, i + BATCH_SIZE);
        await Promise.all(
          batch.map(async (name) => {
            const oggResult = await fetchFreshBytes(`./game/${name}`);
            if (oggResult.ok && oggResult.bytes) {
              await writeToOpfs(gameDir, name, oggResult.bytes);
            }
            done++;
            setProgress(
              (done / total) * 100,
              'Loading...',
              `${done} / ${total}`
            );
          })
        );
      }

      setProgress(100, 'Click to start', 'Paused until click');
    }

    function waitForClickToStart() {
      return new Promise((resolve) => {
        window.__waitingForClickStart = true;
        window.__onClickToStart = async () => {
          if (window.__resumeGameAudio) {
            await window.__resumeGameAudio();
          }
          resolve();
        };
      });
    }

    async function launchGame() {
      try {
        const instance = await createButterscotch({
          canvas,
          locateFile: (path) => `./${path}?_t=${Date.now()}`
        });

        if (typeof instance._mountOpfs === 'function') {
          await instance._mountOpfs();
        }

        // Force Emscripten main loop to run at full uncapped VSync/rAF rate
        if (typeof instance._emscripten_set_main_loop_timing === 'function') {
          instance._emscripten_set_main_loop_timing(0, 1);
        }

        bindButterscotchInputs(instance);

        await waitForClickToStart();

        overlayEl.classList.add('fade-out');
        setTimeout(() => {
          overlayEl.style.display = 'none';
        }, 250);

        window.focus();
        canvas.focus();

        if (window.__resumeGameAudio) {
          await window.__resumeGameAudio();
        }

        await callStartRunnerWithArgs(instance, ['/butterscotch/game/data.win']);
      } catch (err) {
        showError(err);
      }
    }

    (async () => {
      try {
        await prepareFiles();
        await launchGame();
      } catch (err) {
        showError(err);
      }
    })();
  </script>
