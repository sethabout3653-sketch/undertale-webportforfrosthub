<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undertale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff; font-family: monospace;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #loader { position: absolute; text-align: center; z-index: 10; }
    #bar { width: 280px; height: 12px; border: 2px solid #fff; margin-top: 10px; padding: 2px; }
    #fill { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }
    canvas#canvas {
      display: block; width: 100vw; height: 100vh;
      object-fit: contain; image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div id="status">Loading Undertale...</div>
    <div id="bar"><div id="fill"></div></div>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script type="module">
    import createButterscotch from './butterscotch.mjs';

    const statusEl = document.getElementById('status');
    const fillEl = document.getElementById('fill');
    const loaderEl = document.getElementById('loader');
    const canvas = document.getElementById('canvas');

    function setProgress(pct, msg) {
      fillEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      if (msg) statusEl.textContent = msg;
    }

    async function writeToOpfs(dirHandle, fileName, bytes) {
      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }

    async function boot() {
      try {
        setProgress(5, 'Checking audio manifest...');
        let oggFiles = [];
        try {
          const listRes = await fetch('./game/files.json');
          if (listRes.ok) oggFiles = await listRes.json();
        } catch {}

        const total = 1 + oggFiles.length;
        let done = 0;

        const opfsRoot = await navigator.storage.getDirectory();
        const gameDir = await opfsRoot.getDirectoryHandle('game', { create: true });

        setProgress(10, 'Downloading data.win...');
        const dataRes = await fetch('./game/data.win');
        if (!dataRes.ok) throw new Error(`Failed to load ./game/data.win (${dataRes.status})`);
        const dataBytes = new Uint8Array(await dataRes.arrayBuffer());

        await writeToOpfs(opfsRoot, 'data.win', dataBytes);
        await writeToOpfs(gameDir, 'data.win', dataBytes);
        done++;
        setProgress((done / total) * 85, `Loaded data.win (${done}/${total})`);

        for (let i = 0; i < oggFiles.length; i += 10) {
          const batch = oggFiles.slice(i, i + 10);
          await Promise.all(
            batch.map(async (name) => {
              const res = await fetch(`./game/${encodeURIComponent(name)}`);
              if (res.ok) {
                const bytes = new Uint8Array(await res.arrayBuffer());
                await writeToOpfs(opfsRoot, name, bytes);
                await writeToOpfs(gameDir, name, bytes);
              }
              done++;
              setProgress((done / total) * 85, `Loading audio (${done}/${total})...`);
            })
          );
        }

        setProgress(90, 'Starting WebAssembly...');
        const instance = await createButterscotch({
          canvas,
          locateFile: (path) => `./${path}`
        });

        setProgress(95, 'Mounting game storage...');
        if (typeof instance._mountOpfs === 'function') {
          await instance._mountOpfs();
        }

        // Safely log root WasmFS directories if FS is exposed
        try {
          console.log('WasmFS root:', instance.FS.readdir('/'));
          console.log('WasmFS /opfs:', instance.FS.readdir('/opfs'));
        } catch (fsErr) {
          console.log('FS check:', fsErr.message);
        }

        setProgress(98, 'Launching Undertale...');
        loaderEl.style.display = 'none';
        canvas.focus();

        // Try folder path first (/opfs/game), then /opfs, then 0-arg startRunner
        const attempts = [
          () => instance.ccall('startRunner', 'void', ['string'], ['/opfs/game'], { async: true }),
          () => instance.ccall('startRunner', 'void', ['string'], ['/opfs'], { async: true }),
          () => instance.ccall('startRunner', 'void', [], [], { async: true })
        ];

        for (const runAttempt of attempts) {
          try {
            await runAttempt();
            break;
          } catch (e) {
            console.warn('Attempt failed:', e);
          }
        }
      } catch (err) {
        console.error(err);
        loaderEl.style.display = 'block';
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    window.addEventListener('click', () => canvas.focus());
    boot();
  </script>
</body>
</html>
