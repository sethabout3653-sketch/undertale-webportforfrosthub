<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undertale</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      transition: opacity 0.35s ease;
    }

    #overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Classic Undertale Dialogue Box */
    .ut-box {
      width: 100%;
      max-width: 540px;
      border: 4px solid #fff;
      background: #000;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 0 0 4px #000;
    }

    .ut-header {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* Pixel Soul Heart */
    .soul-heart {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .ut-text-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      flex: 1;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
      line-height: 1.4;
      color: #fff;
    }

    #sub-status {
      font-size: 14px;
      color: #aaa;
    }

    /* Undertale HP-style Loading Bar */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bar-label {
      font-size: 14px;
      font-weight: bold;
      color: #ffff00;
      letter-spacing: 1px;
    }

    #bar {
      flex: 1;
      height: 22px;
      background: #660000;
      border: 2px solid #fff;
      position: relative;
      overflow: hidden;
    }

    #fill {
      width: 0%;
      height: 100%;
      background: #ffff00;
      transition: width 0.12s ease-out;
    }

    #pct {
      font-size: 15px;
      font-weight: bold;
      min-width: 48px;
      text-align: right;
      color: #fff;
    }

    .error-state #status {
      color: #ff4444;
    }

    .error-state .soul-heart path {
      fill: #555;
    }

    canvas#canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      outline: none;
    }
  </style>

  <!-- Track AudioContext instances created by the engine and resume suspended ones on user input -->
  <script>
    (function setupAudioContextTracker() {
      const trackedContexts = new Set();
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;

      if (NativeAudioContext) {
        const WrappedAudioContext = function (...args) {
          const ctx = new NativeAudioContext(...args);
          trackedContexts.add(ctx);
          return ctx;
        };
        WrappedAudioContext.prototype = NativeAudioContext.prototype;
        Object.setPrototypeOf(WrappedAudioContext, NativeAudioContext);
        window.AudioContext = WrappedAudioContext;
        if (window.webkitAudioContext) {
          window.webkitAudioContext = WrappedAudioContext;
        }
      }

      function resumeSuspendedContexts() {
        trackedContexts.forEach((ctx) => {
          if (ctx && ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
        });

        if (window.SDL2 && window.SDL2.audioContext && window.SDL2.audioContext.state === 'suspended') {
          window.SDL2.audioContext.resume().catch(() => {});
        }
        if (window.AL && window.AL.contexts) {
          Object.values(window.AL.contexts).forEach((alCtx) => {
            if (alCtx && alCtx.audioCtx && alCtx.audioCtx.state === 'suspended') {
              alCtx.audioCtx.resume().catch(() => {});
            }
          });
        }
      }

      window.__resumeGameAudio = resumeSuspendedContexts;

      ['keydown', 'pointerdown', 'mousedown', 'touchstart'].forEach((evt) => {
        window.addEventListener(evt, resumeSuspendedContexts, { capture: true, passive: true });
      });
    })();
  </script>
</head>

            M2,1 h3 v1 h1 v1 h1 v1 h2 v-1 h1 v-1 h1 v-1 h3 v1 h1 v5 h-1 v2 h-1 v2 h-2 v2 h-2 v2 h-1 v1 h-2 v-1 h-1 v-2 h-2 v-2 h-2 v-2 h-1 v-2 h-1 v-5 h1 z

        </svg>
        <div class="ut-text-group">
          <div id="status">* Preparing game files...</div>

        <span class="bar-label">LOAD</span>
        <div id="bar"><div id="fill"></div></div>
        <span id="pct">0%</span>
      </div>
    </div>
  </div>

    function setProgress(pct, msg, subMsg) {
      const clamped = Math.min(100, Math.max(0, pct));
      fillEl.style.width = `${clamped}%`;
      pctEl.textContent = `${Math.round(clamped)}%`;
      if (msg) statusEl.textContent = msg;
      if (subMsg !== undefined) subStatusEl.textContent = subMsg;
    }

    function showError(err) {
      console.error(err);
      utBoxEl.classList.add('error-state');
      overlayEl.classList.remove('fade-out');
      overlayEl.style.display = 'flex';
      statusEl.textContent = `* Error: ${err.message}`;
      subStatusEl.textContent = 'Check the browser console or refresh to try again.';
    }

    async function writeToOpfs(dirHandle, fileName, bytes) {
      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }

    function callStartRunnerWithArgs(instance, args) {
      const argvPtrs = args.map((str) => instance.stringToNewUTF8(str));
      const argvTable = new Uint32Array(argvPtrs.length + 1);
      argvPtrs.forEach((ptr, idx) => { argvTable[idx] = ptr; });
      argvTable[argvPtrs.length] = 0;

      return instance.ccall(
        'startRunner',
        'number',
        ['number', 'array'],
        [args.length, new Uint8Array(argvTable.buffer)],
        { async: true }
      );
    }

    function bindButterscotchInputs(instance) {
      window.addEventListener('keydown', (e) => {
        if (window.__resumeGameAudio) window.__resumeGameAudio();
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key)) {
          e.preventDefault();
        }
        if (typeof instance._onKeyDown === 'function') {
          instance._onKeyDown(e.keyCode || e.which);
        }
      });

      window.addEventListener('keyup', (e) => {
        if (typeof instance._onKeyUp === 'function') {
          instance._onKeyUp(e.keyCode || e.which);
        }
      });

      canvas.addEventListener('mousemove', (e) => {
        if (typeof instance._onMouseMove === 'function') {
          const rect = canvas.getBoundingClientRect();
          const x = Math.round(((e.clientX - rect.left) / rect.width) * canvas.width);
          const y = Math.round(((e.clientY - rect.top) / rect.height) * canvas.height);
          instance._onMouseMove(x, y);
        }
      });

      canvas.addEventListener('mousedown', (e) => {
        if (window.__resumeGameAudio) window.__resumeGameAudio();
        window.focus();
        canvas.focus();
        if (typeof instance._onMouseDown === 'function') {
          instance._onMouseDown(e.button);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (typeof instance._onMouseUp === 'function') {
          instance._onMouseUp(e.button);
        }
      });
    }

    async function prepareFiles() {
      const opfsRoot = await navigator.storage.getDirectory();
      const gameDir = await opfsRoot.getDirectoryHandle('game', { create: true });

      const total = 1 + OGG_FILES.length;
      let done = 0;

      let hasDataWin = false;
      try {
        const f = await (await gameDir.getFileHandle('data.win')).getFile();
        if (f.size > 1000000) hasDataWin = true;
      } catch {}

      if (!hasDataWin) {
        setProgress(2, '* Downloading core game data...', 'Fetching data.win');
        const res = await fetch('./game/data.win');
        if (!res.ok) throw new Error(`Missing ./game/data.win (${res.status})`);
        await writeToOpfs(gameDir, 'data.win', new Uint8Array(await res.arrayBuffer()));
      }

      done++;
      setProgress((done / total) * 100, '* Loading audio assets...', `File ${done} of ${total} (data.win ready)`);

      const BATCH_SIZE = 20;
      for (let i = 0; i < OGG_FILES.length; i += BATCH_SIZE) {
        const batch = OGG_FILES.slice(i, i + BATCH_SIZE);
        await Promise.all(
          batch.map(async (name) => {
            let cached = false;
            try {
              const f = await (await gameDir.getFileHandle(name)).getFile();
              if (f.size > 0) cached = true;
            } catch {}

            if (!cached) {
              const res = await fetch(`./game/${name}`);
              if (res.ok) {
                await writeToOpfs(gameDir, name, new Uint8Array(await res.arrayBuffer()));
              }
            }

            done++;
            setProgress(
              (done / total) * 100,
              '* Loading audio assets...',
              `File ${done} of ${total} (${name})`
            );
          })
        );
      }

      setProgress(100, '* Launching Undertale...', 'Initializing engine...');
    }

    async function launchGame() {
      try {
        window.focus();
        canvas.focus();

        const instance = await createButterscotch({
          canvas,
          locateFile: (path) => `./${path}`
        });

        if (typeof instance._mountOpfs === 'function') {
          await instance._mountOpfs();
        }

        bindButterscotchInputs(instance);

        overlayEl.classList.add('fade-out');
        setTimeout(() => {
          overlayEl.style.display = 'none';
        }, 350);

        window.focus();
        canvas.focus();

        await callStartRunnerWithArgs(instance, ['/butterscotch/game/data.win']);
      } catch (err) {
        showError(err);
      }
    }

    (async () => {
      try {
        await prepareFiles();
        await launchGame();
      } catch (err) {
        showError(err);
      }
    })();
