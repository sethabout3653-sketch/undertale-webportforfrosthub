<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undertale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff; font-family: monospace;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
    }
    #bar { width: 300px; height: 14px; border: 2px solid #fff; margin-top: 12px; padding: 2px; }
    #fill { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }
    #play-btn {
      display: none;
      margin-top: 20px;
      padding: 12px 28px;
      background: #000;
      color: #ffff00;
      border: 2px solid #ffff00;
      font-family: monospace;
      font-size: 18px;
      cursor: pointer;
    }
    #play-btn:hover {
      background: #ffff00;
      color: #000;
    }
    canvas#canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="status">Loading Undertale files...</div>
    <div id="bar"><div id="fill"></div></div>
    <button id="play-btn">▶ CLICK OR PRESS ENTER TO START</button>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

    function setProgress(pct, msg) {
      fillEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      if (msg) statusEl.textContent = msg;
    }

    async function writeToOpfs(dirHandle, fileName, bytes) {
      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }

    function callStartRunnerWithArgs(instance, args) {
      const argvPtrs = args.map((str) => instance.stringToNewUTF8(str));
      const argvTable = new Uint32Array(argvPtrs.length + 1);
      argvPtrs.forEach((ptr, idx) => { argvTable[idx] = ptr; });
      argvTable[argvPtrs.length] = 0;

      return instance.ccall(
        'startRunner',
        'number',
        ['number', 'array'],
        [args.length, new Uint8Array(argvTable.buffer)],
        { async: true }
      );
    }

    // 1. Preload all files into OPFS /butterscotch/game/ BEFORE starting the runner
    async function prepareFiles() {
      const opfsRoot = await navigator.storage.getDirectory();
      const gameDir = await opfsRoot.getDirectoryHandle('game', { create: true });

      const total = 1 + OGG_FILES.length;
      let done = 0;

      let hasDataWin = false;
      try {
        const f = await (await gameDir.getFileHandle('data.win')).getFile();
        if (f.size > 1000000) hasDataWin = true;
      } catch {}

      if (!hasDataWin) {
        setProgress(5, 'Downloading data.win...');
        const res = await fetch('./game/data.win');
        if (!res.ok) throw new Error(`Missing ./game/data.win (${res.status})`);
        await writeToOpfs(gameDir, 'data.win', new Uint8Array(await res.arrayBuffer()));
      }
      done++;
      setProgress((done / total) * 100, `Loaded data.win (${done}/${total})`);

      const BATCH_SIZE = 20;
      for (let i = 0; i < OGG_FILES.length; i += BATCH_SIZE) {
        const batch = OGG_FILES.slice(i, i + BATCH_SIZE);
        await Promise.all(
          batch.map(async (name) => {
            let cached = false;
            try {
              const f = await (await gameDir.getFileHandle(name)).getFile();
              if (f.size > 0) cached = true;
            } catch {}

            if (!cached) {
              const res = await fetch(`./game/${name}`);
              if (res.ok) {
                await writeToOpfs(gameDir, name, new Uint8Array(await res.arrayBuffer()));
              }
            }
            done++;
            setProgress((done / total) * 100, `Downloading music & audio (${done}/${total})...`);
          })
        );
      }

      setProgress(100, 'All files ready!');
      playBtn.style.display = 'inline-block';
    }

    // 2. Start Butterscotch AFTER user click/keypress (unlocks WebAudio + SDL2 keyboard focus!)

let started = false;
async function launchGame() {
if (started) return;
started = true;
playBtn.style.display = 'none';
statusEl.textContent = 'Starting Undertale...';
try {
window.focus();
canvas.focus();
const instance = await createButterscotch({
canvas,
locateFile: (path) => ./${path}
});
if (typeof instance._mountOpfs === 'function') {
await instance._mountOpfs();
}
overlayEl.style.display = 'none';
window.focus();
canvas.focus();
await callStartRunnerWithArgs(instance, ['butterscotch/game/data.win']);
} catch (err) {
console.error(err);
overlayEl.style.display = 'flex';
statusEl.textContent = Error: ${err.message};
}
}
playBtn.addEventListener('click', launchGame);
window.addEventListener('keydown', (e) => {
if (!started && playBtn.style.display !== 'none' && (e.key === 'Enter' || e.key === 'z' || e.key === 'Z' || e.key === ' ')) {
launchGame();
}
});
window.addEventListener('pointerdown', () => {
if (started) {
window.focus();
canvas.focus();
}
});
prepareFiles().catch((err) => {
console.error(err);
statusEl.textContent = Error: ${err.message};
});
