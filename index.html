
<script>
(function setupLowLatencyAudio() {
  const trackedContexts = new Set();
  const NativeAudioContext = window.AudioContext || window.webkitAudioContext;

  let audioUnlocked = false;
  let resumePending = false;

  function trackContext(ctx) {
    if (!ctx || trackedContexts.has(ctx)) return;

    trackedContexts.add(ctx);

    if (ctx.addEventListener) {
      ctx.addEventListener('statechange', () => {
        if (audioUnlocked && ctx.state === 'suspended') {
          resumeContext(ctx);
        }
      });
    }

    if (audioUnlocked) {
      resumeContext(ctx);
    }
  }

  function resumeContext(ctx) {
    if (!ctx || ctx.state === 'closed') return;

    if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
      try {
        const result = ctx.resume();

        if (result && typeof result.catch === 'function') {
          result.catch(() => {});
        }
      } catch (_) {}
    }
  }

  if (NativeAudioContext) {
    const WrappedAudioContext = function (...args) {
      const ctx = new NativeAudioContext(...args);
      trackContext(ctx);

      if (audioUnlocked) {
        resumeContext(ctx);
      }

      return ctx;
    };

    WrappedAudioContext.prototype = NativeAudioContext.prototype;
    Object.setPrototypeOf(WrappedAudioContext, NativeAudioContext);

    window.AudioContext = WrappedAudioContext;

    if (window.webkitAudioContext) {
      window.webkitAudioContext = WrappedAudioContext;
    }
  }

  function discoverAudioContexts() {
    if (window.SDL2 && window.SDL2.audioContext) {
      trackContext(window.SDL2.audioContext);
    }

    if (window.AL && window.AL.contexts) {
      Object.values(window.AL.contexts).forEach((alCtx) => {
        if (alCtx && alCtx.audioCtx) {
          trackContext(alCtx.audioCtx);
        }
      });
    }
  }

  function resumeAllAudio() {
    discoverAudioContexts();

    trackedContexts.forEach(resumeContext);

    if (window.SDL2 && window.SDL2.audioContext) {
      resumeContext(window.SDL2.audioContext);
    }

    if (window.AL && window.AL.contexts) {
      Object.values(window.AL.contexts).forEach((alCtx) => {
        if (alCtx && alCtx.audioCtx) {
          resumeContext(alCtx.audioCtx);
        }
      });
    }
  }

  function unlockAudio(event) {
    if (event && event.isTrusted === false) return;

    audioUnlocked = true;

    resumeAllAudio();

    // Retry after other game input handlers have initialized audio.
    if (!resumePending) {
      resumePending = true;

      Promise.resolve().then(() => {
        resumeAllAudio();

        requestAnimationFrame(() => {
          resumeAllAudio();
          resumePending = false;
        });
      });
    }
  }

  window.__resumeGameAudio = resumeAllAudio;
  window.__unlockGameAudio = unlockAudio;

  // Capture interactions anywhere in the page, before game input handlers.
  const interactionEvents = [
    'pointerdown',
    'pointerup',
    'mousedown',
    'mouseup',
    'touchstart',
    'touchend',
    'keydown',
    'click'
  ];

  interactionEvents.forEach((eventName) => {
    window.addEventListener(eventName, unlockAudio, {
      capture: true,
      passive: true
    });
  });

  // Handle audio contexts initialized after the game starts.
  const discoverInterval = window.setInterval(() => {
    discoverAudioContexts();

    if (audioUnlocked) {
      resumeAllAudio();
    }
  }, 500);

  window.addEventListener('focus', () => {
    if (audioUnlocked) resumeAllAudio();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && audioUnlocked) {
      resumeAllAudio();
    }
  });

  window.addEventListener('pageshow', () => {
    if (audioUnlocked) resumeAllAudio();
  });
})();
</script>
